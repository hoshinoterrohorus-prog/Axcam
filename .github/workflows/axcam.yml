name: Axcam Android Build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/axcam.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Axcam APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable (if present)
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi

      - name: Build debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: gradlew is missing. Add the Gradle Wrapper to the repository."
            exit 1
          fi

      - name: Upload Axcam APK
        uses: actions/upload-artifact@v4
        with:
          name: Axcam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
